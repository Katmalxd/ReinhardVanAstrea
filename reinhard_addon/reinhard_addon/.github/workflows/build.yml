name: Construir reinhard_addon.jar
on:
  push:
  workflow_dispatch:      # permite lanzarlo a mano desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Gradle 8.8 explícito: así NO hace falta el gradle-wrapper.jar en el repositorio.
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8

      - name: Comprobar que están los jars de MCA y Mowzie's
        run: |
          ls -l libs
          test -f libs/mowziesmobs-1.8.2.jar || { echo "::error::Falta libs/mowziesmobs-1.8.2.jar"; exit 1; }
          test -f libs/mca-7.7.1.jar         || { echo "::error::Falta libs/mca-7.7.1.jar"; exit 1; }

      - name: Compilar
        run: gradle build --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: reinhard_addon-jar
          path: build/libs/*.jar
